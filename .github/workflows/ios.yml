name: iOS Build

on:
  push:
    branches: [main]
    paths: ["kova-ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: kova-ios

      - name: Build (unsigned, simulator-safe)
        run: |
          xcodebuild -project Kova.xcodeproj \
            -scheme Kova \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build CODE_SIGNING_ALLOWED=NO
        working-directory: kova-ios

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kova-ios-build
          path: kova-ios/build/Build/Products/Debug-iphonesimulator/Kova.app
